name: Unpack Democrata Bier for Vercel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unpack-democrata.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack project into repository root
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f DemocrataBierV2.zip ]; then
            echo "DemocrataBierV2.zip not found; nothing to unpack."
            exit 0
          fi
          unzip -o DemocrataBierV2.zip -d .
          rm DemocrataBierV2.zip

      - name: Commit unpacked project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unpack Democrata Bier V2 for Vercel"
          git push
