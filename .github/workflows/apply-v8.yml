name: Apply V8 patch

on:
  push:
    branches:
      - ingredient-picker-v8

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ingredient-picker-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_v8.py
      - name: Commit patched files
        run: |
          rm scripts/apply_v8.py
          rm .github/workflows/apply-v8.yml
          git config user.name "danilopmattos-bot"
          git config user.email "danilopmattos@hotmail.com"
          git add -A
          git commit -m "Apply V8 usability fixes"
          git push origin ingredient-picker-v8
