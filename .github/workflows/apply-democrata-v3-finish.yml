name: Apply Democrata Bier V3 finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-democrata-v3-finish.yml'

permissions:
  contents: write

jobs:
  apply-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V3 files and layout
        shell: bash
        env:
          BREWDAY_GZ_B64: '',
          CSS_GZ_B64: ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, os, re

          brew = gzip.decompress(base64.b64decode(os.environ['BREWDAY_GZ_B64']))
          Path('src/components/BrewdayCockpit.tsx').write_bytes(brew)

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          app = app.replace(
              '<div className="min-h-screen bg-stone-950 text-stone-100 font-sans antialiased selection:bg-amber-500 selection:text-black">',
              '<div className="democrata-shell min-h-screen bg-[#080604] text-stone-100 font-sans antialiased selection:bg-amber-300 selection:text-black">'
          )
          app = app.replace(
              '<main className="lg:ml-72 max-w-[1600px] mx-auto lg:mx-0 px-3 sm:px-5 xl:px-7 py-4 sm:py-6 pb-10 space-y-6">',
              '<main className={activeTab === \'cockpit\' ? \'min-h-screen\' : \'mx-auto max-w-[1720px] px-3 pb-28 pt-4 sm:px-5 sm:pb-10 sm:pt-6 lg:ml-[260px] lg:mr-0 xl:px-7 space-y-6\'}>'
          )
          pattern = r'(\s*\{/\* Top Main Navigation \*/\}\s*)(<Header[\s\S]*?\n\s*/>)'
          match = re.search(pattern, app)
          if match and "activeTab !== 'cockpit'" not in app:
              app = app[:match.start()] + match.group(1) + "{activeTab !== 'cockpit' && (\n      " + match.group(2).lstrip() + "\n      )}" + app[match.end():]
          app_path.write_text(app)

          css_path = Path('src/index.css')
          css = css_path.read_text()
          marker = 'DEMOCRATA BIER V3 — WARM INDUSTRIAL DESIGN SYSTEM'
          if marker not in css:
              extra = gzip.decompress(base64.b64decode(os.environ['CSS_GZ_B64'])).decode()
              css_path.write_text(css.rstrip() + '\n\n' + extra + '\n')
          PY

      - name: Commit V3 finish
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-democrata-v3-finish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V3: premium experience and brewday mode"
          git push
